<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <style>
        body {
            background: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .window {
            width: 400px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #222;
            border-bottom: 1px solid #333;
        }

        .header h1 {
            margin: 0;
            font-size: 14px;
            color: #fff;
        }

        .stats {
            font-size: 11px;
            color: #aaa;
            background: #2a2a2a;
            padding: 3px 8px;
            border-radius: 12px;
        }

        .main-status {
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e1e1e;
        }

        .pc-name-input {
            background: transparent;
            border: none;
            border-bottom: 1px dashed #555;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            width: 150px;
            outline: none;
        }

        .pc-name-input:focus {
            border-bottom: 1px solid #2196f3;
        }

        .status-badge {
            background: rgba(76, 175, 80, 0.15);
            color: #4caf50;
            border: 1px solid rgba(76, 175, 80, 0.5);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid #333;
            background: #1a1a1a;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: 12px;
            cursor: pointer;
            color: #888;
            transition: 0.2s;
        }

        .tab.active {
            color: #fff;
            border-bottom: 2px solid #2196f3;
            background: #222;
        }

        .tab-content {
            padding: 15px;
        }

        .meters-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .meter-row {
            background: #222;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
        }

        .meter-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 8px;
            color: #ccc;
        }

        .meter-val {
            font-family: monospace;
            font-weight: bold;
            color: #fff;
        }

        .meter-bar {
            height: 8px;
            background: #111;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .meter-fill {
            height: 100%;
            background: linear-gradient(90deg, #4caf50 0%, #ffeb3b 80%, #f44336 100%);
            width: 65%;
        }

        .meter-fill.obs {
            width: 40%;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .setting-group.full {
            grid-column: 1 / -1;
        }

        .setting-group label {
            font-size: 10px;
            color: #aaa;
            text-transform: uppercase;
        }

        .setting-group input,
        .setting-group select {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 12px;
            width: 100%;
            box-sizing: border-box;
        }

        .split-row {
            display: flex;
            gap: 8px;
        }

        .toggle-btn {
            width: 100%;
            padding: 8px;
            background: #1e3a24;
            color: #4caf50;
            border: 1px solid #4caf50;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            margin-top: 10px;
        }

        .footer {
            padding: 8px 15px;
            font-size: 10px;
            color: #666;
            background: #151515;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>

    <!-- VIEW 1: MONITOR TABS (COMPACT) -->
    <div style="display: flex; gap: 20px;">

        <div class="window">
            <div class="header">
                <h1>Audio Monitor Agent</h1>
                <div class="stats">CPU: 12% | RAM: 74%</div>
            </div>

            <div class="main-status">
                <div>
                    <input type="text" class="pc-name-input" value="PC-Studio-1" />
                    <div style="font-size: 11px; color: #666; margin-top: 4px;">ID: 3365df9b...</div>
                </div>
                <div style="text-align: right;">
                    <div class="status-badge">AMAN</div>
                </div>
            </div>

            <div class="tabs">
                <div class="tab active">Monitoring</div>
                <div class="tab">Settings</div>
            </div>

            <div class="tab-content">
                <div class="meters-grid">
                    <div class="meter-row">
                        <div class="meter-header">
                            <span>Hardware Mic (Default)</span>
                            <span class="meter-val">45.2 dB</span>
                        </div>
                        <div class="meter-bar">
                            <div class="meter-fill"></div>
                        </div>
                    </div>

                    <div class="meter-row">
                        <div class="meter-header">
                            <span>OBS Output (Mic/Aux)</span>
                            <span class="meter-val">12.0 dB</span>
                        </div>
                        <div class="meter-bar">
                            <div class="meter-fill obs"></div>
                        </div>
                    </div>

                    <button class="toggle-btn">● MONITORING ON</button>
                </div>
            </div>
            <div class="footer">
                <span>Connected to Server</span>
                <span>Connected to OBS</span>
            </div>
        </div>

        <!-- VIEW 2: SETTINGS TABS -->
        <div class="window">
            <div class="header">
                <h1>Audio Monitor Agent</h1>
                <div class="stats">CPU: 12% | RAM: 74%</div>
            </div>

            <div class="main-status">
                <div>
                    <input type="text" class="pc-name-input" value="PC-Studio-1" />
                </div>
                <div style="text-align: right;">
                    <div class="status-badge" style="opacity: 0.5">PAUSED</div>
                </div>
            </div>

            <div class="tabs">
                <div class="tab">Monitoring</div>
                <div class="tab active">Settings</div>
            </div>

            <div class="tab-content" style="padding-top: 10px;">
                <div class="settings-grid">
                    <div class="setting-group full">
                        <label>Server URL</label>
                        <input type="text" value="http://localhost:4000" />
                    </div>

                    <div class="setting-group full"
                        style="margin-top: 5px; padding-top: 10px; border-top: 1px dashed #333;">
                        <label>Hardware Microphone</label>
                        <select>
                            <option>Default - Microphone A</option>
                        </select>
                    </div>

                    <div class="setting-group full">
                        <div class="split-row">
                            <div class="setting-group" style="flex: 1"><label>Noise Gate (%)</label><input type="number"
                                    value="20" /></div>
                            <div class="setting-group" style="flex: 1"><label>Silence (s)</label><input type="number"
                                    value="15" /></div>
                            <div class="setting-group" style="flex: 1"><label>Dead Mic (s)</label><input type="number"
                                    value="60" /></div>
                        </div>
                    </div>

                    <div class="setting-group full">
                        <div class="split-row">
                            <div class="setting-group" style="flex: 1"><label>Batas Pecah (%)</label><input
                                    type="number" value="95" /></div>
                            <div class="setting-group" style="flex: 1"><label>Durasi Pecah (s)</label><input
                                    type="number" value="3" /></div>
                        </div>
                    </div>

                    <div class="setting-group full"
                        style="margin-top: 5px; padding-top: 10px; border-top: 1px dashed #333;">
                        <label>OBS IP & Port</label>
                        <div class="split-row">
                            <input type="text" value="192.168.100.212:4455" style="flex: 2" />
                            <input type="password" value="secret" style="flex: 1" placeholder="Pass" />
                        </div>
                    </div>
                    <div class="setting-group full">
                        <label>OBS Source Name</label>
                        <div class="split-row">
                            <input type="text" value="Mic/Aux" style="flex: 2" />
                            <button
                                style="background: #2196f3; color: white; border: none; border-radius: 4px; cursor: pointer; flex: 1">Connect</button>
                        </div>
                    </div>

                </div>
            </div>
        </div>

    </div>

</body>

</html>
